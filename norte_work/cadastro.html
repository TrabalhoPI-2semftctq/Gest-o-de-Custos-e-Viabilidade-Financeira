<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Norte — Cadastro</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page page-ready">
  <main class="auth-wrap">
    <section class="auth-brand">
      <a class="brand" href="index.html"><span class="brand-mark"></span><span class="brand-name">Norte</span></a>
      <div>
        <h1>Comece a organizar seu dinheiro.</h1>
        <p>Crie sua conta com e-mail e senha para registrar receitas e despesas e controlar seus tetos de gastos.</p>
      </div>
      <div class="auth-mini">© 2026 Norte Finanças</div>
    </section>
    <section class="auth-form">
      <h2>Criar sua conta</h2>
      <p class="auth-subtitle">Preencha os dados para começar.</p>
      <form data-auth="cadastro">
        <div class="form-group"><label for="email">E-mail</label><input class="input" id="email" name="email" type="email"
            placeholder="voce@email.com" required></div>
        <div class="form-row">
          <div class="form-group"><label for="password">Senha</label><input class="input" id="password" name="password" type="password"
              placeholder="••••••••" required></div>
          <div class="form-group"><label for="password2">Confirmar senha</label><input class="input" id="password2" name="password2"
              type="password" placeholder="••••••••" required></div>
        </div>
        <button class="auth-submit" type="submit">Criar conta</button>
      </form>
      <div class="auth-footer">Já possui uma conta? <a href="login.html">Entrar</a></div>
      <a class="back-home" href="index.html">← Voltar ao início</a>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
