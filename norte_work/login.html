<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Norte — Entrar</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page page-ready">
  <main class="auth-wrap">
    <section class="auth-brand">
      <a class="brand" href="index.html"><span class="brand-mark"></span><span class="brand-name">Norte</span></a>
      <div>
        <h1>Suas finanças, no caminho certo.</h1>
        <p>Uma visão simples e organizada para acompanhar receitas, despesas, contas e metas.</p>
      </div>
      <div class="auth-mini">© 2026 Norte Finanças</div>
    </section>
    <section class="auth-form">
      <h2>Bem-vindo de volta</h2>
      <p class="auth-subtitle">Entre na sua conta para continuar.</p>
      <form data-auth="login">
        <div class="form-group"><label for="email">E-mail</label><input class="input" id="email" name="email" type="email"
            placeholder="voce@email.com" required></div>
        <div class="form-group"><label for="password">Senha</label><input class="input" id="password" name="password" type="password"
            placeholder="Digite sua senha" required></div>
        <div class="check-row"><span></span><a href="recuperar.html">Esqueci minha senha</a></div>
        <button class="auth-submit" type="submit">Entrar</button>
      </form>
      <div class="auth-footer">Ainda não tem uma conta? <a href="cadastro.html">Criar conta</a></div>
      <a class="back-home" href="index.html">← Voltar ao início</a>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
